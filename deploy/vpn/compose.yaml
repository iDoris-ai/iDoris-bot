# iDoris VPN control plane for a small/medium organisation.
#
#   Headscale  (official, unmodified)  - Tailscale-compatible coordination server + embedded DERP relay
#   Headplane  (official, unmodified)  - read/operate admin web UI
#   idoris-vpn-enroll (this repo)      - hands short-lived pre-auth keys to client daemons
#
# TLS: terminate at the reverse proxy you already run (Caddy/Traefik/nginx).
#   https://vpn.example.org            -> headscale  (host: 127.0.0.1:${HEADSCALE_PORT}, network: headscale:8080)
#   https://enroll.example.org         -> enroll     (host: 127.0.0.1:${ENROLL_PORT},    network: enroll:8787)
# Headplane is not on that public hostname. HEADPLANE_ACCESS (bootstrap.sh
# --headplane-access, or ctl.sh up --headplane-access) is the only knob.
# It writes base_url, cookie_secure and HEADPLANE_BIND together:
#   tunnel   default. SSH to 127.0.0.1:${HEADPLANE_PORT}. cookie_secure false.
#   lan      plain HTTP on a non-loopback address. Loud warning.
#   tailnet  profile tailnet-admin, no host port. cookie_secure false.
#   proxy    HTTPS on a different name, e.g. https://admin.example.org
#            -> 127.0.0.1:${HEADPLANE_PORT}. cookie_secure true.
#            The server_url host is refused unless HEADPLANE_ALLOW_PUBLIC_ADMIN=1.
# The proxy must pass Host and X-Forwarded-Proto and support WebSocket/Upgrade
# (Tailscale control and DERP both upgrade the connection). Headscale is
# reached on plain HTTP; its embedded DERP needs the *same* https origin as
# server_url plus udp/${DERP_STUN_PORT:-3478} (STUN) reachable from the internet.
# server_url must be https on the default port 443 (no ":port"): Tailscale
# clients re-dial the control server on 443.
# A proxy running as a container joins the network idoris-vpn_default.
#
# Published host ports default to the values shown and can be overridden with
# HEADSCALE_PORT, HEADPLANE_PORT, ENROLL_PORT and DERP_STUN_PORT (env or .env).
# DERP_STUN_PORT must stay 3478 in production: clients learn the STUN port from
# the DERP map, which advertises headscale's stun_listen_addr port.
#
# One compose project per deployment. `name` below is idoris-vpn unless
# COMPOSE_PROJECT_NAME is set (bootstrap.sh --instance writes it to .env).
# A second copy on the same Docker host needs its own project name and its
# own HEADSCALE_PORT, HEADPLANE_PORT, ENROLL_PORT and DERP_STUN_PORT.
# Its headscale stun_listen_addr must advertise the port clients can reach,
# which is not 3478 when the first instance already owns that UDP port.
# See docs/14-VPN-OPERATIONS.md.
#
# HEADPLANE_BIND is written by HEADPLANE_ACCESS (default 127.0.0.1).
# Do not publish Headplane or enroll on a public interface. lan is the only
# mode that binds a non-loopback address, and it warns when it does.
# See docs/14-VPN-OPERATIONS.md.
#
# Profile tailnet-admin (optional): a tailscale sidecar joins as tag:vpn-server
# and Headplane shares its network namespace, so the UI is reachable only on
# the tailnet by group:admins. It uses the same Headplane data volume as the
# published service; do not run both at once. ctl.sh up --tailnet-admin
# stops the published one first. The sidecar needs /dev/net/tun and
# VPN_SERVER_ENROLL_TOKEN (the vpn-server enrollment token).
#
# First run (one organisation; default name "office"):
#   bash deploy/vpn/bootstrap.sh init --org office
# Another organisation (advanced):
#   bash deploy/vpn/bootstrap.sh add-tenant globex
name: ${COMPOSE_PROJECT_NAME:-idoris-vpn}

services:
  headscale:
    # Multi-arch index digest. Keep the tag. To move it: `docker buildx imagetools
    # inspect`, then `docker compose pull`. enroll/Dockerfile is pinned the same way.
    # See docs/14-VPN-OPERATIONS.md.
    image: headscale/headscale:v0.29.6@sha256:cabe84f0699913dbca9320f0883dca7565dd08df3c5be29edfabbebeff763966
    restart: unless-stopped
    command: serve
    volumes:
      - ./headscale/config.yaml:/etc/headscale/config.yaml:ro
      - ./headscale/policy.hujson:/etc/headscale/policy.hujson:ro
      - headscale-data:/var/lib/headscale
      - headscale-run:/var/run/headscale
    ports:
      - "127.0.0.1:${HEADSCALE_PORT:-8080}:8080"   # HTTP control plane -> behind TLS proxy
      - "${DERP_STUN_PORT:-3478}:3478/udp"         # STUN for embedded DERP
    environment:
      TZ: UTC
    healthcheck:
      test: ["CMD", "headscale", "health"]   # distroless image: no wget/curl
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  headplane:
    # Tag is "0.8.2" (no "v" prefix); matches commit 05e3ee33 of tale/headplane.
    image: ghcr.io/tale/headplane:0.8.2@sha256:b053a0a6699d0a67be3f0d9bae8e7dbe35ed67ae8448412adcbad7ea49866faa
    restart: unless-stopped
    depends_on:
      headscale:
        condition: service_healthy
    volumes:
      - ./headplane/config.yaml:/etc/headplane/config.yaml:ro
      # Read-only: Headplane shows the DNS/MagicDNS settings but cannot edit
      # them. Headscale config and policy are managed as files (GitOps).
      - ./headscale/config.yaml:/etc/headscale/config.yaml:ro
      - headplane-data:/var/lib/headplane
      - type: bind
        source: ./headplane/cookie_secret
        target: /run/secrets/headplane_cookie_secret
        read_only: true
        bind:
          create_host_path: false
    # No Docker socket on purpose: even a ":ro" bind of docker.sock grants full
    # control of the host's Docker daemon (root-equivalent) to an internet-facing
    # web UI. The integration would only let Headplane restart Headscale after
    # editing the config, which this deployment does not allow anyway.
    ports:
      # HEADPLANE_BIND default 127.0.0.1: SSH tunnel. See the file header.
      - "${HEADPLANE_BIND:-127.0.0.1}:${HEADPLANE_PORT:-3000}:3000"
    security_opt:
      - no-new-privileges:true

  enroll:
    build:
      context: ../../vpn
      dockerfile: ../deploy/vpn/enroll/Dockerfile
      args:
        VERSION: ${IDORIS_VPN_VERSION:-dev}
    image: ${ENROLL_IMAGE:-idoris-vpn-enroll:local}
    restart: unless-stopped
    depends_on:
      headscale:
        condition: service_healthy
    # bootstrap.sh writes the secret files as the operator (mode 0600) and
    # records that uid/gid in .env so the container can read them.
    user: "${ENROLL_UID:-65532}:${ENROLL_GID:-65532}"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    volumes:
      # create_host_path:false -> compose fails loudly instead of creating a
      # directory when bootstrap.sh has not produced these files yet.
      - type: bind
        source: ./enroll/config.json
        target: /etc/idoris/enroll.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./enroll/headscale.apikey
        target: /etc/idoris/headscale.apikey
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:${ENROLL_PORT:-8787}:8787"

  # Optional. Started only with: docker compose --profile tailnet-admin up
  # Headplane below shares this network namespace; do not also run `headplane`.
  vpn-sidecar:
    profiles: ["tailnet-admin"]
    image: tailscale/tailscale:v1.104.2@sha256:b11583ad2e93e4671128538c88cf11f460444a5d7e449311dd1933a400ab849d
    hostname: vpn-server
    restart: unless-stopped
    depends_on:
      headscale:
        condition: service_healthy
      enroll:
        condition: service_healthy
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      ENROLL_URL: http://enroll:8787
      ENROLL_TOKEN: ${VPN_SERVER_ENROLL_TOKEN:-}
      # Empty unless the operator sets it. The entrypoint treats empty as
      # "use the control_url returned by enroll" (hairpin override).
      VPN_SERVER_LOGIN_SERVER: ${VPN_SERVER_LOGIN_SERVER:-}
      TS_USERSPACE: "false"
      TS_STATE_DIR: /var/lib/tailscale
      TS_AUTH_ONCE: "true"
      TS_HOSTNAME: vpn-server
      TS_ACCEPT_DNS: "false"
    volumes:
      - ./tailnet-admin/entrypoint.sh:/usr/local/bin/idoris-tailnet-entrypoint.sh:ro
      - vpn-sidecar-state:/var/lib/tailscale
    entrypoint: ["/bin/sh", "/usr/local/bin/idoris-tailnet-entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "tailscale status --json | grep -q '\"BackendState\":\"Running\"' || tailscale status --json | grep -q '\"BackendState\": \"Running\"'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Same image and config as headplane, but no host port. Listeners in this
  # namespace are the sidecar's tailnet address.
  headplane-tailnet:
    profiles: ["tailnet-admin"]
    image: ghcr.io/tale/headplane:0.8.2@sha256:b053a0a6699d0a67be3f0d9bae8e7dbe35ed67ae8448412adcbad7ea49866faa
    restart: unless-stopped
    network_mode: "service:vpn-sidecar"
    depends_on:
      vpn-sidecar:
        condition: service_healthy
    volumes:
      - ./headplane/config.yaml:/etc/headplane/config.yaml:ro
      - ./headscale/config.yaml:/etc/headscale/config.yaml:ro
      - headplane-data:/var/lib/headplane
      - type: bind
        source: ./headplane/cookie_secret
        target: /run/secrets/headplane_cookie_secret
        read_only: true
        bind:
          create_host_path: false
    security_opt:
      - no-new-privileges:true

volumes:
  headscale-data:
  headscale-run:
  headplane-data:
  vpn-sidecar-state:
