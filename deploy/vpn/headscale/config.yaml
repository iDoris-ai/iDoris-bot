# Headscale v0.29.x configuration for the iDoris VPN control plane.
# Reference: https://headscale.net/stable/ref/configuration/
# Replace vpn.example.org with your public hostname before first start.
# bootstrap.sh refuses to run while this placeholder is still here.
# server_url must be https on port 443 (no ":port"): Tailscale clients re-dial
# the control server on 443, so the TLS proxy in front must serve it there.
# A local lab can register once over plain HTTP; re-login after that still
# needs this https:443 URL. See docs/14-VPN-OPERATIONS.md.

server_url: https://vpn.example.org
listen_addr: 0.0.0.0:8080
metrics_listen_addr: 127.0.0.1:9090
grpc_listen_addr: 127.0.0.1:50443
grpc_allow_insecure: false

noise:
  private_key_path: /var/lib/headscale/noise_private.key

prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential

derp:
  server:
    # Embedded DERP relay so members behind strict NAT still reach the Local AI
    # host. Requires server_url to be https and udp/3478 open.
    enabled: true
    region_id: 999
    region_code: idoris
    region_name: iDoris Relay
    stun_listen_addr: "0.0.0.0:3478"
    private_key_path: /var/lib/headscale/derp_server_private.key
    automatically_add_embedded_derp_region: true
    # Only tailnet members may use the relay.
    verify_clients: true
  # Keep Tailscale's public relays as fallback; set to [] to be fully self-contained.
  urls:
    - https://controlplane.tailscale.com/derpmap/default
  paths: []
  auto_update_enabled: true
  update_frequency: 24h

disable_check_updates: true

node:
  # Member devices must re-enroll every 180 days (idoris-vpnd does this
  # automatically); tagged nodes such as the Local AI host never expire.
  expiry: 4320h
  ephemeral:
    inactivity_timeout: 30m

database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite
    write_ahead_log: true

# TLS is terminated by the reverse proxy in front of this container.
tls_cert_path: ""
tls_key_path: ""

log:
  format: text
  level: info

policy:
  mode: file
  path: /etc/headscale/policy.hujson

dns:
  magic_dns: true
  # Must differ from the server_url host. MagicDNS is
  # <hostname>.<base_domain>, for example office-local-ai.idoris.internal.
  # The organisation name is not part of the DNS name.
  base_domain: idoris.internal
  override_local_dns: false
  nameservers:
    global:
      - 1.1.1.1
      - 9.9.9.9
  search_domains: []
  extra_records: []

unix_socket: /var/run/headscale/headscale.sock
unix_socket_permission: "0770"

# Optional single sign-on for interactive (non-daemon) registrations.
# oidc:
#   issuer: https://sso.example.org
#   client_id: headscale
#   client_secret_path: /etc/headscale/oidc_secret
#   pkce:
#     enabled: true
#   allowed_domains: [example.org]

logtail:
  enabled: false

