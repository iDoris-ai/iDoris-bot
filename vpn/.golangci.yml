version: "2"
linters:
  default: standard
  enable:
    - errorlint
    - gosec
    - misspell
    - unconvert
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, errcheck]
      - path: cmd/
        text: "G204|G304"   # service installer execs launchctl/systemctl and reads user-chosen config paths by design
