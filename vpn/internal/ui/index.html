<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iDoris 接入</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header>
  <h1>iDoris 接入</h1>
  <p>粘贴一次加入码，确认一次。加入码只留在这台机器上。</p>
</header>

<section id="step1">
  <h2>1. 识别网络</h2>
  <label class="block">加入码
    <input id="code" type="password" autocomplete="off" spellcheck="false">
  </label>
  <label class="check"><input id="insecure" type="checkbox"> 实验室地址（http）</label>
  <button id="save-code" type="button">保存加入码</button>
  <p id="code-state" class="hint"></p>
  <p class="trust">加入码不能证明签发它的人是谁。请只使用组织管理员通过你信任的渠道交给你的加入码。</p>
  <p id="authority" class="authority">保存加入码后，这里会显示登记服务器。</p>
  <label class="check"><input id="confirm-authority" type="checkbox"> 这是我组织的服务器（this is my organisation's server）</label>

  <p id="ai-question" class="question">这台机器就是 Local AI 吗？</p>
  <div class="row">
    <button id="yes-ai" type="button">是，这台就是 Local AI</button>
    <button id="no-ai" type="button">不是，它是另一台设备</button>
  </div>
  <p id="role-state" class="hint"></p>

  <button id="detect" type="button">识别网络</button>
  <div id="networks"></div>
  <div id="checks"></div>

  <label id="device-label" class="block">设备 IP（只填一台，不扫描网段）
    <input id="device" type="text" inputmode="decimal" autocomplete="off" spellcheck="false">
  </label>
  <button id="probe" type="button">测试能否到达</button>
  <p id="probe-state" class="hint"></p>
  <label id="whole-label" class="check"><input id="whole" type="checkbox"> 通告整个子网。这会暴露该网段上的每台设备，并且可能和成员家里的 192.168.0.0/24、192.168.1.0/24、10.0.0.0/24 撞车。默认只通告上面这一台的 /32。</label>

  <button id="recommend" type="button">使用建议</button>
</section>

<section id="step2">
  <h2>2. 建议的配置</h2>
  <pre id="plan">先识别网络，再使用建议。</pre>
</section>

<section id="step3">
  <h2>3. 启用</h2>
  <label class="check"><input id="replace-existing" type="checkbox"> 替换另一组织的现有配置（replace the existing configuration for another organisation）</label>
  <button id="enable" type="button" disabled>启用</button>
  <pre id="result"></pre>
  <pre id="status"></pre>
</section>
<p id="error" class="error"></p>
<script src="/app.js"></script>
</body>
</html>
