# Integration fixture: real Headscale + real tailscaled (userspace) + idoris-vpnd.
# Driven by integration_test.go (go test -tags integration ./integration/).
name: idoris-vpn-it
services:
  headscale:
    image: headscale/headscale:v0.29.6@sha256:cabe84f0699913dbca9320f0883dca7565dd08df3c5be29edfabbebeff763966 # headscale/headscale:v0.29.6
    command: serve
    volumes:
      - ./headscale/config.yaml:/etc/headscale/config.yaml:ro
      - ./headscale/derp.yaml:/etc/headscale/derp.yaml:ro
      # Throwaway TLS material generated by the test at runtime (gitignored).
      - ./.pki/tls.crt:/etc/headscale/tls.crt:ro
      - ./.pki/tls.key:/etc/headscale/tls.key:ro
    ports:
      - "127.0.0.1::443"   # ephemeral host port; the test discovers it via `docker compose port`
    healthcheck:
      test: ["CMD", "headscale", "health"]   # distroless image: no wget/curl
      interval: 2s
      timeout: 2s
      retries: 30

  ts-node:
    image: tailscale/tailscale:v1.104.2@sha256:b11583ad2e93e4671128538c88cf11f460444a5d7e449311dd1933a400ab849d # tailscale/tailscale:v1.104.2
    depends_on:
      headscale:
        condition: service_healthy
    # Plain tailscaled, no containerboot: nobody logs it in except idoris-vpnd.
    entrypoint: ["/usr/local/bin/tailscaled"]
    command: ["--state=/var/lib/tailscale/tailscaled.state", "--socket=/var/run/tailscale/tailscaled.sock", "--tun=userspace-networking", "--port=41641"]
    hostname: it-member
    environment:
      # Go's crypto/x509 on Linux honors SSL_CERT_FILE; tailscaled's control
      # client verifies Headscale's cert against the system roots.
      SSL_CERT_FILE: /etc/it-pki/ca.pem
    volumes:
      - ../bin/idoris-vpnd-linux:/opt/idoris-vpnd:ro
      - ./.pki/ca.pem:/etc/it-pki/ca.pem:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
