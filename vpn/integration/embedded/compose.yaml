# Embedded-mode fixture. The test passes -p so this file has no project name.
# Host ports are ephemeral (127.0.0.1::443). Two Headscale servers share one
# runtime CA. The member container keeps a userspace tailscaled on the foreign
# server and runs idoris-vpnd, which should pick an in-process node for ours.
services:
  headscale:
    image: headscale/headscale:v0.29.6
    command: serve
    volumes:
      - ./headscale/config.yaml:/etc/headscale/config.yaml:ro
      - ./headscale/policy.hujson:/etc/headscale/policy.hujson:ro
      - ../.pki-embedded/tls.crt:/etc/headscale/tls.crt:ro
      - ../.pki-embedded/tls.key:/etc/headscale/tls.key:ro
    ports:
      - "127.0.0.1::443"
    healthcheck:
      test: ["CMD", "headscale", "health"]
      interval: 2s
      timeout: 2s
      retries: 30

  headscale-foreign:
    image: headscale/headscale:v0.29.6
    command: serve
    volumes:
      - ./foreign/config.yaml:/etc/headscale/config.yaml:ro
      - ./foreign/derp.yaml:/etc/headscale/derp.yaml:ro
      - ../.pki-embedded/tls.crt:/etc/headscale/tls.crt:ro
      - ../.pki-embedded/tls.key:/etc/headscale/tls.key:ro
    ports:
      - "127.0.0.1::443"
    healthcheck:
      test: ["CMD", "headscale", "health"]
      interval: 2s
      timeout: 2s
      retries: 30

  member:
    image: tailscale/tailscale:v1.104.2
    depends_on:
      headscale:
        condition: service_healthy
      headscale-foreign:
        condition: service_healthy
    # Userspace, so the in-process tsnet node can run beside it. Nobody but the
    # test logs this tailscaled in, and it logs into the foreign server.
    entrypoint: ["/usr/local/bin/tailscaled"]
    command: ["--state=/var/lib/tailscale/tailscaled.state", "--socket=/var/run/tailscale/tailscaled.sock", "--tun=userspace-networking", "--port=41641"]
    hostname: it-foreign
    environment:
      SSL_CERT_FILE: /etc/it-pki/ca.pem
    volumes:
      - ../../bin/idoris-vpnd-linux:/opt/idoris-vpnd:ro
      - ../../bin/echosrv-linux:/opt/echosrv:ro
      - ../.pki-embedded/ca.pem:/etc/it-pki/ca.pem:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  local-ai:
    image: tailscale/tailscale:v1.104.2
    depends_on:
      headscale:
        condition: service_healthy
    # Kernel TUN so a normal TCP listener receives tailnet connections.
    entrypoint: ["/usr/local/bin/tailscaled"]
    command: ["--state=/var/lib/tailscale/tailscaled.state", "--socket=/var/run/tailscale/tailscaled.sock", "--port=41641"]
    hostname: acme-local-ai
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      SSL_CERT_FILE: /etc/it-pki/ca.pem
    volumes:
      - ../../bin/echosrv-linux:/opt/echosrv:ro
      - ../.pki-embedded/ca.pem:/etc/it-pki/ca.pem:ro
