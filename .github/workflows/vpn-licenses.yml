name: vpn-licenses
# Go module notices only. Shell and YAML under deploy/vpn do not change
# vpn/THIRD_PARTY_NOTICES.md, so this workflow does not watch deploy/vpn.
on:
  push:
    branches: [main]
    paths:
      - "vpn/go.mod"
      - "vpn/go.sum"
      - "vpn/**/*.go"
      - "vpn/Makefile"
      - "vpn/scripts/**"
      - "vpn/THIRD_PARTY_NOTICES.md"
      - ".github/workflows/vpn-licenses.yml"
  pull_request:
    paths:
      - "vpn/go.mod"
      - "vpn/go.sum"
      - "vpn/**/*.go"
      - "vpn/Makefile"
      - "vpn/scripts/**"
      - "vpn/THIRD_PARTY_NOTICES.md"
      - ".github/workflows/vpn-licenses.yml"

permissions:
  contents: read

jobs:
  licenses:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vpn
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: vpn/go.mod
          cache-dependency-path: vpn/go.sum
      - run: make licenses
